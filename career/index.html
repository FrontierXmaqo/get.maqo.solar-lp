html,body{margin:0;min-height:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#000;background:#fff;display:flex;flex-direction:column;min-height:100vh;line-height:1.5}

.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.btn{display:inline-block;padding:14px 26px;border-radius:20px;border:2px solid #1E4E38;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,color .15s}
.btn-primary{background:#1E4E38;color:#fff}
.btn-primary:hover{background:#163b2a;border-color:#163b2a}
.btn-ghost{background:#fff;color:#1E4E38}
.btn-ghost:hover{background:#1E4E38;color:#fff}
.btn:focus-visible{outline:3px solid #188bf6;outline-offset:2px}
footer{padding:20px;text-align:center;color:#707070;font-size:13px;border-top:1px solid #f5f5f5}
footer a{color:#1E4E38}
